<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slideshow: 2×Looker + WebLink — Auto + Top-Right Controls</title>
  <style>
    :root { --bg:#ffffff; }
    html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif;}
    .container{position:absolute;inset:0;display:none;width:100vw;height:100vh;background:var(--bg);}
    .container.active{display:block;}

    /* Looker double-buffer */
    .dash-wrap{position:relative;width:100%;height:100%;}
    .stack{position:relative;width:100%;height:100%;}
    .stack>iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 300ms ease;}
    .stack>iframe.visible{opacity:1;pointer-events:auto;}

    /* Image / Video */
    img{width:100%;height:100%;object-fit:contain;display:block;background:var(--bg);}
    #youtube-iframe{width:100%;height:100%;}

    /* WebLink zoom (ẩn UI) */
    #weblink{background:#fff;}
    .weblink-outer{position:absolute;inset:0;overflow:auto;background:#fff;}
    .weblink-inner{
      width:calc(100% / var(--zoom,1));
      height:calc(100% / var(--zoom,1));
      transform:scale(var(--zoom,1));
      transform-origin:top left;
    }
    .weblink-inner>iframe{width:100%;height:100%;border:0;background:#fff;}

    /* ===== Control panel (top-right + scalable) ===== */
    .ctrl {
      position:fixed; right:10px; top:10px;
      display:flex; align-items:center; gap:8px;
      background:rgba(0,0,0,.55); color:#fff; padding:6px 10px;
      border-radius:12px; backdrop-filter:blur(4px); z-index:9999;
      opacity:0; pointer-events:none; transition:opacity .25s ease, transform .1s ease;
      transform-origin: top right;
    }
    .ctrl.show{opacity:1; pointer-events:auto;}
    .ctrl.scaled{ transform: scale(var(--ctrl-scale,1)); }
    .ctrl button, .ctrl select{
      border:0; border-radius:8px; padding:6px 10px; font-weight:600;
    }
    .ctrl button{cursor:pointer;}
    .ctrl select{background:#fff; color:#000;}
  </style>
</head>
<body>

  <!-- LOOKER #1 -->
  <div class="container active" id="looker1">
    <div class="dash-wrap">
      <div class="stack" id="stack1"
           data-url="https://lookerstudio.google.com/embed/reporting/253ec4e8-26bf-40af-aec6-7c8507f1f3df/page/v4lxC?rm=minimal&chromeless=1">
        <iframe class="visible" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
  </div>

  <!-- LOOKER #2 -->
  <div class="container" id="looker2">
    <div class="dash-wrap">
      <div class="stack" id="stack2"
           data-url="https://lookerstudio.google.com/embed/reporting/36b6b653-e30a-4f13-bc29-400c9e35fa63/page/p_n0r1ltpexd?rm=minimal&chromeless=1">
        <iframe class="visible" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
  </div>

  <!-- WEB LINK (giữ trạng thái, chỉ zoom) -->
  <div class="container" id="weblink">
    <div class="weblink-outer" id="weblinkOuter" style="--zoom:0.90">
      <div class="weblink-inner">
        <iframe id="weblink-iframe" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; clipboard-write"></iframe>
      </div>
    </div>
  </div>

  <!-- IMAGE (tuỳ chọn) -->
  <div class="container" id="image">
    <img src="images/4minute.png" alt="Slide ảnh">
  </div>

  <!-- VIDEO (YouTube) -->
  <div class="container" id="video">
    <!-- API sẽ chèn/loại bỏ iframe vào div mount này -->
    <div id="youtube-iframe"></div>
  </div>

  <!-- Control Panel -->
  <div class="ctrl scaled" id="ctrl" style="--ctrl-scale:1">
    <button id="btnPrev">◀ Prev</button>
    <button id="btnPlayPause">⏸ Pause</button>
    <button id="btnNext">Next ▶</button>
  </div>

<script>
  /* ===== CONFIG ===== */
  const SHOW_LOOKER2 = false;
  const SHOW_VIDEO   = false;
  const SHOW_IMAGE           = false;
  const LOOKER_DURATION_MS   = 60000;
  const WEBLINK_DURATION_MS  = 180000;
  const IMAGE_DURATION_MS    = 240000;
  const VIDEO_LIMIT_MS       = 250000;
  const RELOAD_ON_SHOW       = true;
  const FADE_MS              = 300;

  // WebLink
  const WEBLINK_URL = 'https://appdvn31.ap.averydennison.net:8443/ailidevoverall/device/overall';
  const WEBLINK_DEFAULT_ZOOM = 0.9;
  const PERSIST_WEBLINK_STATE = true;

  // Panel
  const AUTOPLAY_DEFAULT = true;
  const CTRL_AUTOHIDE_MS = 2500;
  const CTRL_SCALE = 1.25;

  // YouTube
  const YT_VIDEO_ID = 'Rtacb6pn7vk';
  const YT_PRIVACY_MODE = false; // không-cookie mode nếu cần

  /* ===== refs ===== */
  const elL1=document.getElementById('looker1'),
        elL2=document.getElementById('looker2'),
        elWeb=document.getElementById('weblink'),
        elImg=document.getElementById('image'),
        elVid=document.getElementById('video');
  const stack1=document.getElementById('stack1'),
        stack2=document.getElementById('stack2'),
        webIframe=document.getElementById('weblink-iframe'),
        webOuter=document.getElementById('weblinkOuter');
  const ctrl=document.getElementById('ctrl'),
        btnPrev=document.getElementById('btnPrev'),
        btnNext=document.getElementById('btnNext'),
        btnPlayPause=document.getElementById('btnPlayPause');

  let stageTimer=null, videoTimer=null;
  let player=null, ytReady=false;

  const flow = [
    'looker1',
    ...(SHOW_LOOKER2 ? ['looker2'] : []),
    'weblink',
    ...(SHOW_IMAGE ? ['image'] : []),
    ...(SHOW_VIDEO ? ['video'] : [])
  ];

  let idx=0, shownL1=false, shownL2=false, weblinkLoaded=false;
  let autoplay=AUTOPLAY_DEFAULT, ctrlTimer=null;

  /* ===== helpers ===== */
  function setActive(name){
    [elL1,elL2,elWeb,elImg,elVid].forEach(el=>el.classList.remove('active'));
    ({looker1:elL1,looker2:elL2,weblink:elWeb,image:elImg,video:elVid}[name]).classList.add('active');
  }
  function clearTimers(){[stageTimer,videoTimer].forEach(t=>t&&clearTimeout(t)); stageTimer=videoTimer=null;}
  function addTs(u){const s=u.includes('?')?'&':'?';return `${u}${s}_ts=${Date.now()}`;}
  function softRefresh(stack){
    const base=stack.dataset.url||'';if(!base)return;
    const old=stack.querySelector('iframe.visible'), n=document.createElement('iframe');
    n.allowFullscreen=true; n.referrerPolicy='strict-origin-when-cross-origin'; n.src=addTs(base);
    stack.appendChild(n);
    n.addEventListener('load',()=>{requestAnimationFrame(()=>{n.classList.add('visible');old&&(old.classList.remove('visible'),setTimeout(()=>old.remove(),FADE_MS+50));});},{once:true});
  }
  function applyWeblinkZoom(z){webOuter.style.setProperty('--zoom',Math.max(0.5,Math.min(2,parseFloat(z)||1)));}

  /* ===== YouTube API ===== */
  function ensureYT(){
    return new Promise(r=>{
      if(window.YT && YT.Player) return r();
      const s=document.createElement('script');
      s.src='https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
      window.onYouTubeIframeAPIReady=()=>r();
    });
  }

  function createPlayerWithBust(){
    // Xoá player cũ (nếu có)
    try{ player && player.destroy && player.destroy(); }catch(e){}
    ytReady=false;

    // Đảm bảo mount là một DIV rỗng (API sẽ thay bằng iframe mới)
    let mount=document.getElementById('youtube-iframe');
    if(!mount || mount.tagName!=='DIV'){
      // nếu đang là iframe hoặc bị mất mount → tạo lại
      if(mount) mount.remove();
      mount=document.createElement('div');
      mount.id='youtube-iframe';
      elVid.appendChild(mount);
    }else{
      mount.innerHTML='';
    }

    // Tạo player mới (thêm tham số “bust” để đảm bảo reload cứng)
    const origin = encodeURIComponent(location.origin);
    const bust = Date.now(); // cache-busting
    player = new YT.Player('youtube-iframe',{
      videoId: YT_VIDEO_ID,
      playerVars: {
        autoplay: 1,
        mute: 1,
        rel: 0,
        playsinline: 1,
        controls: 0,
        modestbranding: 1,
        origin: location.origin,
        // tham số tùy ý để chắc chắn URL thay đổi
        cc_lang_pref: bust   // dùng như một “timestamp” vô hại
      },
      events:{
        onReady: ()=>{ ytReady=true; try{ player.playVideo && player.playVideo(); }catch(e){}; },
        onStateChange: e=>{
          if(e.data===YT.PlayerState.ENDED){
            clearTimers();
            if(autoplay) next();
          }
        },
        onError: ()=>{ // nếu lỗi, thử tạo lại 1 lần nữa
          setTimeout(()=>{
            try{ player && player.destroy && player.destroy(); }catch(e){}
            createPlayerWithBust();
          }, 250);
        }
      }
    });
  }

  async function reloadVideoHard(){
    await ensureYT();
    createPlayerWithBust(); // luôn tạo player mới → luôn reload
  }

  /* ===== screens ===== */
  function doTimer(ms){ if(!autoplay) return; stageTimer=setTimeout(next,ms); }

  function showLooker1(){
    clearTimers(); setActive('looker1');
    try{ player && player.stopVideo && player.stopVideo(); }catch(e){}
    if(RELOAD_ON_SHOW && shownL1) softRefresh(stack1);
    shownL1=true; doTimer(LOOKER_DURATION_MS);
  }
  function showLooker2(){
    clearTimers(); setActive('looker2');
    try{ player && player.stopVideo && player.stopVideo(); }catch(e){}
    if(RELOAD_ON_SHOW && shownL2) softRefresh(stack2);
    shownL2=true; doTimer(LOOKER_DURATION_MS);
  }
  function showWebLink(){
    clearTimers(); setActive('weblink');
    try{ player && player.stopVideo && player.stopVideo(); }catch(e){}
    applyWeblinkZoom(WEBLINK_DEFAULT_ZOOM);
    if(!weblinkLoaded || !PERSIST_WEBLINK_STATE){
      webIframe.src = addTs(WEBLINK_URL);
      weblinkLoaded=true;
    }
    doTimer(WEBLINK_DURATION_MS);
  }
  function showImage(){
    clearTimers(); setActive('image');
    try{ player && player.stopVideo && player.stopVideo(); }catch(e){}
    doTimer(IMAGE_DURATION_MS);
  }

  async function showVideo(){
    clearTimers(); setActive('video');
    await reloadVideoHard(); // ⇦ MỖI LẦN VÀO VIDEO ĐỀU RELOAD + AUTO-PLAY
    if(autoplay){
      videoTimer=setTimeout(()=>{ try{ player && player.stopVideo && player.stopVideo(); }catch(e){}; next(); }, VIDEO_LIMIT_MS);
    }
  }

  function go(i){ idx=(i%flow.length+flow.length)%flow.length;
    ({looker1:showLooker1,looker2:showLooker2,weblink:showWebLink,image:showImage,video:showVideo})[flow[idx]]();
  }
  function next(){ go(idx+1); }
  function prev(){ go(idx-1); }

  /* ===== Controls ===== */
  ctrl.style.setProperty('--ctrl-scale',CTRL_SCALE);
  function updatePlayLabel(){ btnPlayPause.textContent=autoplay?'⏸ Pause':'▶ Play'; }
  btnPrev.onclick=()=>prev();
  btnNext.onclick=()=>next();
  btnPlayPause.onclick=()=>{ autoplay=!autoplay; updatePlayLabel(); go(idx); };
  function showCtrl(){ ctrl.classList.add('show'); clearTimeout(ctrlTimer); ctrlTimer=setTimeout(()=>ctrl.classList.remove('show'),CTRL_AUTOHIDE_MS); }
  window.addEventListener('mousemove',showCtrl,{passive:true});
  window.addEventListener('touchstart',showCtrl,{passive:true});
  window.addEventListener('keydown',e=>{
    if(['INPUT','SELECT','TEXTAREA'].includes(e.target?.tagName))return;
    if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
    if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
    if(e.key.toLowerCase()==='p'){ e.preventDefault(); btnPlayPause.click(); }
  });

  /* ===== boot ===== */
  document.addEventListener('DOMContentLoaded',()=>{
    const f1=stack1.querySelector('iframe.visible'); if(f1) f1.src=addTs(stack1.dataset.url||'');
    const f2=stack2.querySelector('iframe.visible'); if(f2) f2.src=addTs(stack2.dataset.url||'');
    applyWeblinkZoom(WEBLINK_DEFAULT_ZOOM);
    updatePlayLabel(); go(0);
    ctrl.classList.add('show'); setTimeout(()=>ctrl.classList.remove('show'),CTRL_AUTOHIDE_MS);
  });
</script>
</body>
</html>
