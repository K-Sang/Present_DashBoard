<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slideshow: Looker + Ảnh + Video (double-buffer + YT 153 fix)</title>
  <style>
    :root { --bg: #ffffff; }
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:var(--bg); font-family:system-ui,sans-serif; }
    .container { position:absolute; inset:0; display:none; width:100vw; height:100vh; background:var(--bg); }
    .container.active { display:block; }

    .dash-wrap { position:relative; width:100%; height:100%; background:var(--bg); }

    .stack { position:relative; width:100%; height:100%; background:var(--bg); }
    .stack > iframe {
      position:absolute; inset:0;
      width:100%; height:100%; border:0; display:block; background:var(--bg);
      opacity:0; pointer-events:none; transition: opacity 300ms ease;
    }
    .stack > iframe.visible { opacity:1; pointer-events:auto; }

    img { width:100%; height:100%; object-fit:contain; display:block; background:var(--bg); }
    iframe.fill { width:100%; height:100%; border:0; display:block; background:var(--bg); }
    #youtube-iframe { width:100%; height:100%; border:0; display:block; }
  </style>
</head>
<body>

  <!-- LOOKER (double-buffer) -->
  <div class="container active" id="dashboard">
    <div class="dash-wrap">
      <div class="stack" id="dashStack"
           data-url="https://lookerstudio.google.com/embed/reporting/253ec4e8-26bf-40af-aec6-7c8507f1f3df/page/v4lxC?rm=minimal&chromeless=1">
        <iframe class="visible" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
  </div>

  <!-- WEB LINK (sau Looker 1, 3 phút) -->
  <div class="container" id="weblink">
    <iframe id="weblink-iframe"
            class="fill"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="fullscreen; clipboard-write">
    </iframe>
  </div>

  <!-- IMAGE (tuỳ chọn) -->
  <div class="container" id="image">
    <img src="images/4minute.png" alt="Slide ảnh">
  </div>

  <!-- VIDEO (YouTube) -->
  <div class="container" id="video">
    <iframe
      id="youtube-iframe"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write"
      title="YouTube video"
    ></iframe>
  </div>

  <script>
    /* ===== CẤU HÌNH ===== */
    const SHOW_IMAGE = false;
    const DASHBOARD_DURATION = 10000;     // 2 phút
    const WEBLINK_DURATION   = 180000;     // 3 phút (theo yêu cầu)
    const IMAGE_DURATION     = 240000;     // 4 phút
    const VIDEO_LIMIT_MS     = 250000;     // 4m10s fallback
    const RELOAD_DASH_ON_SHOW = true;
    const DASH_REFRESH_MS     = 0;         // 0 = tắt
    const FADE_MS             = 300;

    // Web link bạn yêu cầu
    const WEBLINK_URL = 'https://appdvn31.ap.averydennison.net:8443/ailidevoverall/device/overall';

    // YouTube
    const YT_VIDEO_ID     = 'Rtacb6pn7vk';
    const YT_PRIVACY_MODE = false;

    /* ===== BIẾN ===== */
    const elDash   = document.getElementById('dashboard');
    const elWeb    = document.getElementById('weblink');
    const elImg    = document.getElementById('image');
    const elVid    = document.getElementById('video');
    const dashStack= document.getElementById('dashStack');
    const webIframe= document.getElementById('weblink-iframe');
    const ytIframe = document.getElementById('youtube-iframe');

    let stageTimer = null, videoTimer = null, dashPeriodicTimer = null;
    let player = null, retriedOnce = false;
    // Flow: Looker → WebLink (3') → (Image nếu bật) → Video
    const flow = ['dashboard', 'weblink', ...(SHOW_IMAGE ? ['image'] : []), 'video'];
    let idx = 0, hasShownDashOnce = false;

    /* ===== TIỆN ÍCH HIỂN THỊ ===== */
    function setActive(name) {
      [elDash, elWeb, elImg, elVid].forEach(el => el.classList.remove('active'));
      ({dashboard: elDash, weblink: elWeb, image: elImg, video: elVid}[name]).classList.add('active');
    }
    function clearTimers() {
      if (stageTimer)       { clearTimeout(stageTimer); stageTimer = null; }
      if (videoTimer)       { clearTimeout(videoTimer); videoTimer = null; }
      if (dashPeriodicTimer){ clearInterval(dashPeriodicTimer); dashPeriodicTimer = null; }
    }
    function buildUrl(base) {
      const sep = base.includes('?') ? '&' : '?';
      return `${base}${sep}_ts=${Date.now()}`; // cache-buster
    }

    // ===== DOUBLE-BUFFER cho Looker =====
    function softRefreshDash() {
      const base = dashStack.dataset.url || '';
      if (!base) return;

      const oldIframe = dashStack.querySelector('iframe.visible');
      const newIframe = document.createElement('iframe');
      newIframe.setAttribute('allowfullscreen', '');
      newIframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      newIframe.src = buildUrl(base);
      dashStack.appendChild(newIframe);

      newIframe.addEventListener('load', () => {
        requestAnimationFrame(() => {
          newIframe.classList.add('visible');
          if (oldIframe) {
            oldIframe.classList.remove('visible');
            setTimeout(() => oldIframe.remove(), FADE_MS + 50);
          }
        });
      }, { once: true });
    }

    /* ===== YOUTUBE ===== */
    function buildYTUrl() {
      const host = YT_PRIVACY_MODE ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com';
      return (
        `${host}/embed/${YT_VIDEO_ID}`
        + `?enablejsapi=1&autoplay=1&mute=1&rel=0&playsinline=1`
        + `&origin=${encodeURIComponent(window.location.origin)}`
      );
    }
    function loadYouTubeIframe() { ytIframe.src = buildYTUrl(); }
    function ensureYTApi() {
      return new Promise((resolve) => {
        if (window.YT && window.YT.Player) return resolve();
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
        window.onYouTubeIframeAPIReady = () => resolve();
      });
    }
    function initYTPlayer() {
      player = new YT.Player('youtube-iframe', {
        events: {
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) { clearTimers(); next(); }
          },
          onError: () => {
            if (!retriedOnce) {
              retriedOnce = true;
              ytIframe.src = buildYTUrl() + `&ts=${Date.now()}`;
            }
          }
        }
      });
    }

    /* ===== MÀN HÌNH ===== */
    function showDashboard() {
      clearTimers();
      setActive('dashboard');
      if (player && player.stopVideo) player.stopVideo();

      if (RELOAD_DASH_ON_SHOW && hasShownDashOnce) softRefreshDash();
      hasShownDashOnce = true;

      if (DASH_REFRESH_MS > 0) {
        dashPeriodicTimer = setInterval(softRefreshDash, DASH_REFRESH_MS);
      }

      stageTimer = setTimeout(next, DASHBOARD_DURATION);
    }

    function showWebLink() {
      clearTimers();
      setActive('weblink');
      if (player && player.stopVideo) player.stopVideo();
      // Gán src khi vào màn để tránh tải nền
      try { webIframe.src = buildUrl(WEBLINK_URL); } catch(e) {}
      stageTimer = setTimeout(next, WEBLINK_DURATION);
    }

    function showImage() {
      clearTimers();
      setActive('image');
      if (player && player.stopVideo) player.stopVideo();
      stageTimer = setTimeout(next, IMAGE_DURATION);
    }

    function showVideo() {
      clearTimers();
      setActive('video');
      retriedOnce = false;
      if (player && player.playVideo) {
        try { player.seekTo(0, true); } catch(e) {}
        player.playVideo();
      }
      videoTimer = setTimeout(() => { if (player && player.stopVideo) player.stopVideo(); next(); }, VIDEO_LIMIT_MS);
    }

    function next() { idx = (idx + 1) % flow.length; run(); }
    function run() {
      const name = flow[idx];
      if (name === 'dashboard') return showDashboard();
      if (name === 'weblink')   return showWebLink();
      if (name === 'image')     return showImage();
      if (name === 'video')     return showVideo();
    }

    /* ===== BOOT ===== */
    document.addEventListener('DOMContentLoaded', async () => {
      const first = dashStack.querySelector('iframe.visible');
      if (first) first.src = buildUrl(dashStack.dataset.url || '');

      loadYouTubeIframe();
      ensureYTApi().then(initYTPlayer);

      idx = 0; run();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && player && player.pauseVideo) player.pauseVideo();
    });
  </script>
</body>
</html>
