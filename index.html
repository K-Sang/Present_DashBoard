<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chiếu Tự Động Looker, Hình Ảnh & Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .container.active {
            display: flex;
        }
        iframe, img {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container active" id="dashboard-container">
        <iframe src="https://lookerstudio.google.com/embed/reporting/253ec4e8-26bf-40af-aec6-7c8507f1f3df/page/v4lxC"></iframe>
    </div>

    <div class="container" id="image-container">
        <img src="images/4minute.png" alt="Hình ảnh trình chiếu">
    </div>

    <div class="container" id="video-container">
        <div id="youtube-player" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        const dashboardContainer = document.getElementById('dashboard-container');
        const imageContainer = document.getElementById('image-container');
        const videoContainer = document.getElementById('video-container');

        // THỜI GIAN HIỂN THỊ DASHBOARD (ĐƠN VỊ: miligiây)
        const dashboardDuration = 120000; // 2 phút

        // THỜI GIAN HIỂN THỊ HÌNH ẢNH (ĐƠN VỊ: miligiây)
        const imageDuration = 240000; // 4 phút

        var player;

        // HÀM CHÍNH ĐIỀU KHIỂN LOGIC TRÌNH CHIẾU
        function startShow() {
            dashboardContainer.classList.add('active');
            imageContainer.classList.remove('active');
            videoContainer.classList.remove('active');
            if (player && player.stopVideo) {
                player.stopVideo();
            }

            console.log('Đang hiển thị Dashboard...');

            setTimeout(() => {
                showImage();
            }, dashboardDuration);
        }

        // HÀM HIỂN THỊ HÌNH ẢNH
        function showImage() {
            dashboardContainer.classList.remove('active');
            imageContainer.classList.add('active');
            videoContainer.classList.remove('active');
            if (player && player.stopVideo) {
                player.stopVideo();
            }

            console.log('Đang hiển thị Hình ảnh...');

            setTimeout(() => {
                showVideo();
            }, imageDuration);
        }

        // HÀM HIỂN THỊ VÀ BẮT ĐẦU PHÁT VIDEO
        function showVideo() {
            dashboardContainer.classList.remove('active');
            imageContainer.classList.remove('active');
            videoContainer.classList.add('active');

            console.log('Đang phát Video...');

            if (player && player.playVideo) {
                player.playVideo();
            }
        }

        // KHI VIDEO KẾT THÚC, QUAY LẠI ĐẦU CHU TRÌNH
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                console.log('Video đã kết thúc. Quay lại Dashboard.');
                startShow();
            }
        }

        // TẢI YOUTUBE PLAYER API VÀ KHỞI TẠO TRÌNH PHÁT
        function onYouTubeIframeAPIReady() {
            const videoId = 'Rtacb6pn7vk';

            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 1,
                    'fs': 1,
                    'rel': 0
                },
                events: {
                    'onReady': (event) => {
                        startShow();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
</body>
</html>
